<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DRIVELLA production shader compile test</title>
<style>
html,body{margin:0;padding:0;background:#080817;color:#eafaff;font:13px Consolas,monospace}
main{max-width:900px;margin:28px auto;padding:0 18px}
h1{font-size:16px;color:#8ef5ff;letter-spacing:.15em}
pre{padding:16px;background:#10152a;border:1px solid #58eaff55;line-height:1.5;white-space:pre-wrap}
.pass{color:#8dffc3}.fail{color:#ff829e}
canvas{width:16px;height:16px;position:absolute;left:-30px;top:-30px}
</style>
</head>
<body><main>
<h1>DRIVELLA // PRODUCTION GLSL COMPILE</h1>
<canvas id="gl" width="32" height="32"></canvas>
<pre id="report">Extracting production shaders…</pre>
</main>
<script>
(async()=>{
'use strict';
const report=document.getElementById('report');
const must=(condition,message)=>{if(!condition)throw new Error(message);};
const response=await fetch('../index.html',{cache:'no-store'});
must(response.ok,'Cannot fetch production index.html: HTTP '+response.status);
const html=await response.text();
const version=html.match(/const VERSION='([^']+)',BUILD='([^']+)'/);
must(version&&version[1]==='v0.19.01'&&version[2]==='167','Unexpected production version marker: '+JSON.stringify(version));
function expression(name,endMarker){
 const marker='const '+name+'=';
 const start=html.indexOf(marker);
 must(start>=0,'Missing production shader source '+name);
 const exprStart=start+marker.length;
 const end=html.indexOf(endMarker,exprStart);
 must(end>exprStart,'Could not find end of shader expression '+name);
 let expr=html.slice(exprStart,end).trim();
 if(expr.endsWith(';'))expr=expr.slice(0,-1).trim();
 return expr;
}
const canvas=document.getElementById('gl');
const gl=canvas.getContext('webgl',{alpha:true,antialias:false,preserveDrawingBuffer:true});
must(gl,'WebGL context unavailable');
const glExpression={getShaderPrecisionFormat:()=>gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER,gl.HIGH_FLOAT)};
const sources={
 mainVertex:new Function('gl','return ('+expression('vs',';\nconst fs=')+');')(glExpression),
 mainFragment:new Function('gl','return ('+expression('fs',';\nfunction shader')+');')(glExpression),
 outlineVertex:new Function('gl','return ('+expression('outlineVs',';\nconst outlineFs=')+');')(glExpression),
 outlineFragment:new Function('gl','return ('+expression('outlineFs',';const outlineProgram=')+');')(glExpression),
 sunVertex:new Function('gl','return ('+expression('sunVs',';\n const sunFs=')+');')(glExpression),
 sunFragment:new Function('gl','return ('+expression('sunFs',';\n gpuSunProgram=')+');')(glExpression)
};
function compile(type,source,label){
 const shader=gl.createShader(type);
 must(shader,'createShader failed: '+label);
 gl.shaderSource(shader,source);gl.compileShader(shader);
 const ok=gl.getShaderParameter(shader,gl.COMPILE_STATUS);
 const log=gl.getShaderInfoLog(shader)||'';
 if(!ok)throw new Error(label+' compile failed:\n'+log);
 return {shader,log};
}
function link(vertex,fragment,label){
 const p=gl.createProgram();
 gl.attachShader(p,vertex.shader);gl.attachShader(p,fragment.shader);gl.linkProgram(p);
 const ok=gl.getProgramParameter(p,gl.LINK_STATUS),log=gl.getProgramInfoLog(p)||'';
 if(!ok)throw new Error(label+' link failed:\n'+log);
 return {program:p,log};
}
const mainV=compile(gl.VERTEX_SHADER,sources.mainVertex,'Main vertex');
const mainF=compile(gl.FRAGMENT_SHADER,sources.mainFragment,'Main fragment');
const mainP=link(mainV,mainF,'Main material program');
const outlineV=compile(gl.VERTEX_SHADER,sources.outlineVertex,'Bloom vertex');
const outlineF=compile(gl.FRAGMENT_SHADER,sources.outlineFragment,'Bloom fragment');
const outlineP=link(outlineV,outlineF,'Bloom post-process program');
const sunV=compile(gl.VERTEX_SHADER,sources.sunVertex,'Sun vertex');
const sunF=compile(gl.FRAGMENT_SHADER,sources.sunFragment,'Sun fragment');
const sunP=link(sunV,sunF,'Depth-occluded sun program');

// Verify that the existing half-resolution mask target format is framebuffer-complete.
const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,16,16,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
const depth=gl.createRenderbuffer();gl.bindRenderbuffer(gl.RENDERBUFFER,depth);gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT16,16,16);
const fbo=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,depth);
const framebufferStatus=gl.checkFramebufferStatus(gl.FRAMEBUFFER);
must(framebufferStatus===gl.FRAMEBUFFER_COMPLETE,'Visible-scene mask framebuffer incomplete: '+framebufferStatus);
gl.bindFramebuffer(gl.FRAMEBUFFER,null);

// Parse the actual inline game script without running the expensive game loop.
const inlineScripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]).filter(x=>x.trim());
must(inlineScripts.length>0,'No inline game script found');
for(let i=0;i<inlineScripts.length;i++)new Function(inlineScripts[i]);

const checks={
 mainMaterialShaderCompiled:true,
 bloomPostShaderCompiled:true,
 sunOcclusionShaderCompiled:true,
 allThreeProgramsLinked:true,
 sceneMaskFramebufferComplete:true,
 gameInlineJavaScriptParses:true,
 bloomTogglePresent:html.includes('data-fx="sunAuraWrap"'),
 bloomDebugTogglePresent:html.includes('data-fx="sunAuraDebug"'),
 f4HandlerPresent:html.includes("e.code==='F4'"),
 sunUsesVisibleMask:html.includes('uOcclusionMask')&&html.includes('renderGpuSunBackground(aoTarget.texture)'),
 sunDrawMovedAfterSceneMask:!html.includes('if(!shadowPass&&!outlinePass)renderGpuSunBackground();'),
 realEdgeBloomPresent:html.includes('outerBloom=(1.0-centerCoverage)*wideCoverage')
};
must(Object.values(checks).every(Boolean),'One or more production source wiring checks failed');
const glError=gl.getError();
must(glError===gl.NO_ERROR,'WebGL error after production shader compile test: '+glError);
const result={pass:true,version:version[1],build:version[2],checks,glVersion:gl.getParameter(gl.VERSION),renderer:gl.getParameter(gl.RENDERER),glError};
window.__GAME_SHADER_RESULT__=result;
report.className='pass';
report.textContent='PASS\n'+JSON.stringify(result,null,2);
document.title='PASS DRIVELLA production shaders';
})().catch(error=>{
 const report=document.getElementById('report');
 report.className='fail';
 report.textContent='FAIL\n'+(error.stack||String(error));
 window.__GAME_SHADER_RESULT__={pass:false,error:String(error)};
 document.title='FAIL DRIVELLA production shaders';
});
</script></body></html>
