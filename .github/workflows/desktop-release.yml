name: DRIVELLA Windows desktop package

# Manual only while the desktop edition is deferred. This prevents documentation
# commits and unrelated prototype edits from downloading/building the large CEF SDK.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CEF_ARCHIVE: "cef_binary_156.0.14+g4fa4ab5+chromium-156.0.8078.48_windows64_minimal.tar.bz2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Download CEF minimal distribution
        shell: pwsh
        run: |
          $url = "https://cef-builds.spotifycdn.com/$env:CEF_ARCHIVE"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\cef.tar.bz2"
          tar -xjf "$env:RUNNER_TEMP\cef.tar.bz2" -C "$env:RUNNER_TEMP"
          $cef = Get-ChildItem "$env:RUNNER_TEMP" -Directory -Filter "cef_binary_*_windows64_minimal" | Select-Object -First 1
          if (-not $cef) { throw "CEF extraction failed" }
          "CEF_ROOT=$($cef.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using CEF at $($cef.FullName)"
      - name: Configure CEF host
        shell: pwsh
        run: cmake -S desktop/game -B build -A x64 "-DCEF_ROOT=$env:CEF_ROOT"
      - name: Build CEF host
        run: cmake --build build --config Release --target DrivellaGame
      - name: Publish self-contained launcher
        run: dotnet publish desktop/launcher/DrivellaLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out/launcher
      - name: Stage desktop application files
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter "DrivellaGame.exe" | Where-Object { $_.FullName -match "\\Release\\" } | Select-Object -First 1
          if (-not $exe) { throw "DrivellaGame.exe was not produced" }
          New-Item -ItemType Directory -Force out/game | Out-Null
          Copy-Item "$($exe.Directory.FullName)\*" out/game -Recurse -Force
          if (-not (Test-Path out/game/libcef.dll)) { throw "CEF runtime libcef.dll is missing" }
          if (-not (Test-Path out/launcher/DRIVELLA.exe)) { throw "Launcher executable is missing" }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".Replace("desktop-v", "") } else { "0.1.0-preview" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$version" desktop/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DRIVELLA-Windows-x64
          path: out/installer/DRIVELLA-Setup.exe
          if-no-files-found: error
          retention-days: 14
      # Public releases are intentionally disabled for the unsandboxed GPU prototype.
      # Enable release publishing only after the CEF bootstrap sandbox and binary signing are integrated.
