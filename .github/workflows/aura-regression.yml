name: Inner-surface bloom regression
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tools/game-shader-compile.html'
      - 'tools/run-aura-regression.mjs'
      - '.github/workflows/aura-regression.yml'
  workflow_dispatch:

jobs:
  webgl-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production inner-surface bloom pixel regression
        run: node tools/run-aura-regression.mjs
      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drivella-aura-regression
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
